name: Build runtimes

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release after every target passes (default branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tests/make_fixture.py --check
      - id: plan
        run: echo "matrix=$(python scripts/runtime.py plan)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: '2022'
          sdk: ${{ matrix.windows_sdk }}
      - if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Build, package and test extracted native libraries
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: python scripts/runtime.py build --target ${{ matrix.id }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: runtime-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  ci:
    name: All runtime checks
    if: always()
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every target to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$PLAN_RESULT" = success && test "$BUILD_RESULT" = success

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: [plan, build, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: runtime-*
          path: dist
          merge-multiple: true
      - name: Verify complete release assets
        run: python scripts/runtime.py verify
      - name: Stage, verify remote assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py
